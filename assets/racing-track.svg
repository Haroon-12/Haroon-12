<svg width="1000" height="300" viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#080b12"/>
<stop offset="100%" stop-color="#111827"/>
</linearGradient>

<filter id="glow">
<feGaussianBlur stdDeviation="3" result="blur"/>
<feMerge>
<feMergeNode in="blur"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>

<path id="trackPath"
d="M120 220
C120 105 230 70 365 75
C530 82 610 145 735 115
C850 88 920 125 890 205
C865 268 710 265 610 235
C480 195 385 225 290 235
C205 244 140 250 120 220"/>

</defs>

<!-- Background -->

<rect width="1000" height="300" rx="24" fill="url(#bg)"/>

<g opacity=".35" stroke="#374151" stroke-width="1">
<path d="M80 0V300"/>
<path d="M180 0V300"/>
<path d="M280 0V300"/>
<path d="M380 0V300"/>
<path d="M480 0V300"/>
<path d="M580 0V300"/>
<path d="M680 0V300"/>
<path d="M780 0V300"/>
<path d="M880 0V300"/>
</g>

<!-- Track -->

<use href="#trackPath"
fill="none"
stroke="#000"
stroke-opacity=".6"
stroke-width="58"/>

<use href="#trackPath"
fill="none"
stroke="#303844"
stroke-width="48"/>

<use href="#trackPath"
fill="none"
stroke="#111827"
stroke-width="40"
stroke-dasharray="22 18"/>

<!-- Header -->

<text x="50" y="40"
fill="#94a3b8"
font-family="Arial, Helvetica, sans-serif"
font-size="12"
letter-spacing="3">
CAREER TRACK // IN PROGRESS </text>

<circle cx="944" cy="35" r="5" fill="#22c55e"/>

<text x="958" y="39"
fill="#cbd5e1"
font-family="Arial, Helvetica, sans-serif"
font-size="11"
text-anchor="end">
MOVING </text>

<!-- Checkpoints -->

<g font-family="Arial, Helvetica, sans-serif"
text-anchor="middle">

<g transform="translate(220 112)">
<circle r="17" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>
<text y="4" fill="#fff" font-size="12" font-weight="700">01</text>
<text y="-27" fill="#cbd5e1" font-size="13" font-weight="700">FAST</text>
</g>

<g transform="translate(410 82)">
<circle r="17" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>
<text y="4" fill="#fff" font-size="12" font-weight="700">02</text>
<text y="-27" fill="#cbd5e1" font-size="13" font-weight="700">MOBOROID</text>
</g>

<g transform="translate(620 130)">
<circle r="17" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>
<text y="4" fill="#fff" font-size="12" font-weight="700">03</text>
<text y="-27" fill="#cbd5e1" font-size="13" font-weight="700">TELENOR</text>
</g>

<g transform="translate(815 155)">
<circle r="17" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>
<text y="4" fill="#fff" font-size="12" font-weight="700">04</text>
<text y="-27" fill="#cbd5e1" font-size="13" font-weight="700">ZONES</text>
</g>

</g>

<!-- Animated car -->

<g filter="url(#glow)">

<g>

<animateMotion
dur="9s"
repeatCount="indefinite"
rotate="auto">

<mpath href="#trackPath"/>

</animateMotion>

<!-- Car body -->

<rect x="-18" y="-8"
width="36"
height="16"
rx="7"
fill="#f8fafc"/>

<!-- Roof -->

<path d="M-11 -8 L-4 -15 H9 L16 -8Z"
fill="#94a3b8"/>

<!-- Window -->

<rect x="-7" y="-12"
width="12"
height="7"
rx="2"
fill="#0f172a"/>

<!-- Wheels -->

<circle cx="-10" cy="8" r="4" fill="#030712"/>
<circle cx="10" cy="8" r="4" fill="#030712"/>

<!-- Headlights -->

<circle cx="-10" cy="-8" r="2" fill="#fff"/>
<circle cx="10" cy="-8" r="2" fill="#fff"/>

</g>

</g>

<!-- Finish -->

<g transform="translate(880 220)">

<circle r="25"
fill="#0f172a"
stroke="#e5e7eb"
stroke-width="2"/>

<text y="-2"
fill="#fff"
font-family="Arial, Helvetica, sans-serif"
font-size="11"
font-weight="700"
text-anchor="middle">
NEXT </text>

<text y="12"
fill="#94a3b8"
font-family="Arial, Helvetica, sans-serif"
font-size="9"
text-anchor="middle">
BUILD </text>

</g>

</svg>
