<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
  width="1400"
  height="520"
  viewBox="0 0 1400 520"
>

  <defs>

    <!-- ============================= -->
    <!-- BACKGROUND -->
    <!-- ============================= -->

    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06090f"/>
      <stop offset="50%" stop-color="#0b1018"/>
      <stop offset="100%" stop-color="#05070b"/>
    </linearGradient>

    <pattern
      id="grid"
      width="40"
      height="40"
      patternUnits="userSpaceOnUse"
    >
      <path
        d="M40 0H0V40"
        fill="none"
        stroke="#18212c"
        stroke-width="1"
      />
    </pattern>

    <!-- ============================= -->
    <!-- TRACK -->
    <!-- ============================= -->

    <linearGradient id="track" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3d444e"/>
      <stop offset="50%" stop-color="#272d36"/>
      <stop offset="100%" stop-color="#363d47"/>
    </linearGradient>

    <!-- ============================= -->
    <!-- GLOW -->
    <!-- ============================= -->

    <filter id="glow">
      <feGaussianBlur
        stdDeviation="4"
        result="blur"
      />

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- ============================= -->
    <!-- CAR SHADOW -->
    <!-- ============================= -->

    <filter id="carShadow">

      <feGaussianBlur
        in="SourceAlpha"
        stdDeviation="4"
        result="blur"
      />

      <feOffset
        dx="3"
        dy="4"
        result="offsetblur"
      />

      <feComponentTransfer>
        <feFuncA
          type="linear"
          slope="0.5"
        />
      </feComponentTransfer>

      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>


    <!-- ============================= -->
    <!-- CLEAN CLOSED RACE CIRCUIT -->
    <!-- No intersections / no loops -->
    <!-- ============================= -->

    <path
      id="circuit"
      d="
        M 190 300

        C 145 270 145 205 185 170

        C 225 135 290 125 350 140

        C 405 154 440 190 485 205

        C 535 222 585 210 615 175

        C 645 140 700 120 755 130

        C 820 142 865 180 905 205

        C 950 232 1015 235 1065 215

        C 1120 193 1185 195 1220 230

        C 1255 265 1255 325 1220 360

        C 1180 400 1115 400 1065 375

        C 1010 348 955 350 910 375

        C 860 402 800 420 740 405

        C 680 390 640 355 590 345

        C 535 334 485 350 435 375

        C 380 402 315 410 265 385

        C 220 362 205 330 190 300

        Z
      "
      fill="none"
    />


    <!-- ============================= -->
    <!-- BMW M5 COMPETITION -->
    <!-- Top-down / facing right -->
    <!-- ============================= -->

    <g id="bmwM5">

      <!-- Shadow -->
      <ellipse
        cx="5"
        cy="4"
        rx="70"
        ry="28"
        fill="#000000"
        opacity="0.5"
      />


      <!-- Main body -->
      <path
        d="
          M -65 -17

          C -53 -22 -43 -27 -30 -28

          L 18 -28

          C 35 -28 48 -22 60 -14

          L 68 -7

          C 73 -3 73 3 68 7

          L 60 14

          C 48 22 35 28 18 28

          L -30 28

          C -43 27 -53 22 -65 17

          L -72 11

          C -77 6 -77 -6 -72 -11

          Z
        "
        fill="url(#track)"
        stroke="#e5e7eb"
        stroke-width="1.5"
      />


      <!-- Silver body panels -->
      <path
        d="
          M -63 -15

          C -48 -20 -36 -23 -20 -24

          L 20 -24

          C 38 -23 50 -18 61 -10

          L 67 -4

          L 67 4

          L 61 10

          C 50 18 38 23 20 24

          L -20 24

          C -36 23 -48 20 -63 15

          L -69 9

          C -72 5 -72 -5 -69 -9

          Z
        "
        fill="#b7bcc4"
        opacity="0.7"
      />


      <!-- Front bumper -->
      <path
        d="
          M 59 -14

          L 75 -9
          L 80 0
          L 75 9
          L 59 14

          L 67 5
          L 67 -5
          Z
        "
        fill="#101318"
      />


      <!-- Kidney grille -->
      <path
        d="
          M 66 -7
          Q 74 -7 78 -3
          L 78 0
          L 66 0
          Z
        "
        fill="#030405"
      />

      <path
        d="
          M 66 0
          L 78 0
          Q 74 7 66 7
          Z
        "
        fill="#030405"
      />


      <!-- Hood -->
      <path
        d="
          M 18 -21

          C 34 -20 47 -15 57 -9

          L 64 -3
          L 64 3
          L 57 9

          C 47 15 34 20 18 21

          Z
        "
        fill="#8f96a0"
        opacity="0.5"
      />


      <!-- Windshield -->
      <path
        d="
          M 5 -21

          C 17 -20 28 -17 37 -12

          L 45 -7
          L 45 7
          L 37 12

          C 28 17 17 20 5 21

          Z
        "
        fill="#101722"
        stroke="#66707d"
        stroke-width="1"
      />


      <!-- Roof -->
      <path
        d="
          M -28 -20

          C -15 -25 0 -26 8 -22

          L 8 22

          C 0 26 -15 25 -28 20

          Z
        "
        fill="#080b10"
        stroke="#4b5563"
        stroke-width="1.2"
      />


      <!-- Rear window -->
      <path
        d="
          M -48 -16

          C -38 -19 -30 -19 -24 -17

          L -24 17

          C -30 19 -38 19 -48 16

          Z
        "
        fill="#111827"
        stroke="#4b5563"
        stroke-width="1"
      />


      <!-- BMW M stripes -->
      <path
        d="
          M -5 -22
          L 2 -23
          L 2 23
          L -5 22
          Z
        "
        fill="#2563eb"
      />

      <path
        d="
          M 2 -23
          L 9 -22
          L 9 22
          L 2 23
          Z
        "
        fill="#38bdf8"
      />

      <path
        d="
          M 9 -22
          L 16 -21
          L 16 21
          L 9 22
          Z
        "
        fill="#ef4444"
      />


      <!-- Headlights -->
      <path
        d="
          M 51 -15

          Q 61 -13 68 -8

          L 62 -2
          L 49 -6

          Z
        "
        fill="#dbeafe"
      />

      <path
        d="
          M 51 15

          Q 61 13 68 8

          L 62 2
          L 49 6

          Z
        "
        fill="#dbeafe"
      />


      <!-- LED strips -->
      <path
        d="M 53 -11 L 65 -7"
        stroke="#ffffff"
        stroke-width="1.5"
      />

      <path
        d="M 53 11 L 65 7"
        stroke="#ffffff"
        stroke-width="1.5"
      />


      <!-- Side mirrors -->
      <path
        d="
          M 6 -24
          L 15 -31
          L 23 -29
          L 16 -21
          Z
        "
        fill="#080a0d"
      />

      <path
        d="
          M 6 24
          L 15 31
          L 23 29
          L 16 21
          Z
        "
        fill="#080a0d"
      />


      <!-- Door lines -->
      <path
        d="
          M -28 -18
          L -18 -18
          L -18 18
          L -28 18
        "
        fill="none"
        stroke="#6b7280"
        stroke-width="1"
      />

      <path
        d="
          M -18 -18
          L 0 -18
          L 0 18
          L -18 18
        "
        fill="none"
        stroke="#6b7280"
        stroke-width="1"
      />


      <!-- Rear lights -->
      <path
        d="
          M -63 -15
          L -50 -12
          L -50 -4
          L -67 -7
          Z
        "
        fill="#dc2626"
      />

      <path
        d="
          M -63 15
          L -50 12
          L -50 4
          L -67 7
          Z
        "
        fill="#dc2626"
      />


      <!-- Wheels -->
      <g
        fill="#050505"
        stroke="#4b5563"
        stroke-width="2"
      >

        <rect
          x="-30"
          y="-32"
          width="25"
          height="10"
          rx="4"
        />

        <rect
          x="25"
          y="-32"
          width="25"
          height="10"
          rx="4"
        />

        <rect
          x="-30"
          y="22"
          width="25"
          height="10"
          rx="4"
        />

        <rect
          x="25"
          y="22"
          width="25"
          height="10"
          rx="4"
        />

      </g>


      <!-- Wheel highlights -->
      <g
        fill="none"
        stroke="#9ca3af"
        stroke-width="1"
      >

        <path d="M -24 -29 L -10 -29"/>
        <path d="M 31 -29 L 45 -29"/>
        <path d="M -24 29 L -10 29"/>
        <path d="M 31 29 L 45 29"/>

      </g>


      <!-- M5 badge -->
      <text
        x="-40"
        y="4"
        fill="#f8fafc"
        font-family="Arial, Helvetica, sans-serif"
        font-size="6"
        font-weight="700"
        letter-spacing="1"
      >
        M5
      </text>

    </g>

  </defs>


  <!-- ========================================= -->
  <!-- BACKGROUND -->
  <!-- ========================================= -->

  <rect
    width="1400"
    height="520"
    fill="url(#background)"
  />

  <rect
    width="1400"
    height="520"
    fill="url(#grid)"
    opacity="0.4"
  />


  <!-- ========================================= -->
  <!-- TRACK OUTER BORDER -->
  <!-- ========================================= -->

  <use
    xlink:href="#circuit"
    stroke="#05070a"
    stroke-width="46"
    fill="none"
    stroke-linecap="round"
    stroke-linejoin="round"
  />


  <!-- ========================================= -->
  <!-- TRACK ROAD -->
  <!-- ========================================= -->

  <use
    xlink:href="#circuit"
    stroke="url(#track)"
    stroke-width="34"
    fill="none"
    stroke-linecap="round"
    stroke-linejoin="round"
  />


  <!-- ========================================= -->
  <!-- ROAD CENTER MARKING -->
  <!-- ========================================= -->

  <use
    xlink:href="#circuit"
    stroke="#747d89"
    stroke-width="1.5"
    stroke-dasharray="14 18"
    fill="none"
    opacity="0.75"
  />


  <!-- ========================================= -->
  <!-- RED RACING LINE -->
  <!-- ========================================= -->

  <use
    xlink:href="#circuit"
    stroke="#ef4444"
    stroke-width="2"
    stroke-dasharray="5 22"
    fill="none"
    opacity="0.7"
  />


  <!-- ========================================= -->
  <!-- NAME + ONLINE -->
  <!-- ========================================= -->

  <g transform="translate(58 58)">

    <circle
      cx="0"
      cy="-7"
      r="5"
      fill="#22c55e"
      filter="url(#glow)"
    />

    <text
      x="15"
      y="0"
      fill="#f8fafc"
      font-family="Arial, Helvetica, sans-serif"
      font-size="25"
      font-weight="700"
      letter-spacing="3"
    >
      HAROON WAHEED
    </text>

  </g>


  <!-- ========================================= -->
  <!-- START / FINISH -->
  <!-- ========================================= -->

  <g transform="translate(190 300)">

    <rect
      x="-4"
      y="-23"
      width="8"
      height="46"
      fill="#ffffff"
    />

    <path
      d="
        M -4 -23 H 4 V -15 H -4
        M -4 -7 H 4 V 1 H -4
        M -4 9 H 4 V 17 H -4
      "
      fill="#111827"
    />

    <text
      x="14"
      y="-28"
      fill="#f8fafc"
      font-family="Arial, Helvetica, sans-serif"
      font-size="9"
      font-weight="700"
      letter-spacing="2"
    >
      START
    </text>

  </g>


  <!-- ========================================= -->
  <!-- FAST -->
  <!-- ========================================= -->

  <g transform="translate(210 160)">

    <circle
      r="6"
      fill="#ef4444"
      filter="url(#glow)"
    />

    <circle
      r="2"
      fill="#ffffff"
    />

    <text
      x="14"
      y="-2"
      fill="#f8fafc"
      font-family="Arial, Helvetica, sans-serif"
      font-size="11"
      font-weight="700"
      letter-spacing="2"
    >
      FAST
    </text>

    <text
      x="14"
      y="12"
      fill="#64748b"
      font-family="Arial, Helvetica, sans-serif"
      font-size="8"
      letter-spacing="1.5"
    >
      2022
    </text>

  </g>


  <!-- ========================================= -->
  <!-- MOBOROID -->
  <!-- ========================================= -->

  <g transform="translate(475 205)">

    <circle
      r="6"
      fill="#ef4444"
      filter="url(#glow)"
    />

    <circle
      r="2"
      fill="#ffffff"
    />

    <text
      x="14"
      y="-2"
      fill="#f8fafc"
      font-family="Arial, Helvetica, sans-serif"
      font-size="11"
      font-weight="700"
      letter-spacing="2"
    >
      MOBOROID
    </text>

    <text
      x="14"
      y="12"
      fill="#64748b"
      font-family="Arial, Helvetica, sans-serif"
      font-size="8"
      letter-spacing="1.5"
    >
      2024
    </text>

  </g>


  <!-- ========================================= -->
  <!-- TELENOR -->
  <!-- ========================================= -->

  <g transform="translate(700 128)">

    <circle
      r="6"
      fill="#ef4444"
      filter="url(#glow)"
    />

    <circle
      r="2"
      fill="#ffffff"
    />

    <text
      x="14"
      y="-2"
      fill="#f8fafc"
      font-family="Arial, Helvetica, sans-serif"
      font-size="11"
      font-weight="700"
      letter-spacing="2"
    >
      TELENOR
    </text>

    <text
      x="14"
      y="12"
      fill="#64748b"
      font-family="Arial, Helvetica, sans-serif"
      font-size="8"
      letter-spacing="1.5"
    >
      2025
    </text>

  </g>


  <!-- ========================================= -->
  <!-- ZONES -->
  <!-- ========================================= -->

  <g transform="translate(1060 215)">

    <circle
      r="7"
      fill="#22c55e"
      filter="url(#glow)"
    />

    <circle
      r="2"
      fill="#ffffff"
    />

    <text
      x="14"
      y="-2"
      fill="#f8fafc"
      font-family="Arial, Helvetica, sans-serif"
      font-size="11"
      font-weight="700"
      letter-spacing="2"
    >
      ZONES
    </text>

    <text
      x="14"
      y="12"
      fill="#22c55e"
      font-family="Arial, Helvetica, sans-serif"
      font-size="8"
      letter-spacing="1.5"
    >
      2026 • NOW
    </text>

  </g>


  <!-- ========================================= -->
  <!-- NEXT -->
  <!-- ========================================= -->

  <g transform="translate(1090 375)">

    <circle
      r="6"
      fill="#64748b"
    />

    <text
      x="14"
      y="-2"
      fill="#f8fafc"
      font-family="Arial, Helvetica, sans-serif"
      font-size="11"
      font-weight="700"
      letter-spacing="2"
    >
      NEXT
    </text>

    <text
      x="14"
      y="12"
      fill="#64748b"
      font-family="Arial, Helvetica, sans-serif"
      font-size="8"
      letter-spacing="1.5"
    >
      2026+
    </text>

  </g>


  <!-- ========================================= -->
  <!-- BMW M5 - MEDIUM SIZE -->
  <!-- ========================================= -->

  <use
    xlink:href="#bmwM5"
    transform="scale(0.60)"
    filter="url(#carShadow)"
  >

    <animateMotion
      dur="7s"
      repeatCount="indefinite"
      rotate="auto"
      calcMode="linear"
    >

      <mpath xlink:href="#circuit"/>

    </animateMotion>

  </use>


  <!-- ========================================= -->
  <!-- FOOTER -->
  <!-- ========================================= -->

  <text
    x="58"
    y="485"
    fill="#f8fafc"
    font-family="Arial, Helvetica, sans-serif"
    font-size="10"
    font-weight="700"
    letter-spacing="3"
  >
    LEARN  •  BUILD  •  SHIP  •  REPEAT
  </text>

</svg>
