<svg width="1000" height="320" viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg">

<defs>

  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#05070b"/>
    <stop offset="55%" stop-color="#0b1120"/>
    <stop offset="100%" stop-color="#111827"/>
  </linearGradient>

  <linearGradient id="road" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#374151"/>
    <stop offset="100%" stop-color="#1f2937"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="shadow">
    <feGaussianBlur stdDeviation="8"/>
  </filter>

  <!-- Racing line -->

<path id="raceLine"
 d="M110 235
    C95 170 120 105 205 82
    C300 56 395 70 470 105
    C540 138 590 155 665 130
    C755 100 850 105 900 155
    C950 205 910 260 825 265
    C730 272 665 225 585 215
    C495 204 435 238 350 255
    C250 275 145 285 110 235"/>

</defs>

<!-- ===================================================== -->

<!-- BACKGROUND -->

<!-- ===================================================== -->

<rect
width="1000"
height="320"
rx="24"
fill="url(#bg)"
/>

<!-- subtle grid -->

<g opacity="0.22" stroke="#64748b" stroke-width="1">

  <path d="M60 0V320"/>
  <path d="M160 0V320"/>
  <path d="M260 0V320"/>
  <path d="M360 0V320"/>
  <path d="M460 0V320"/>
  <path d="M560 0V320"/>
  <path d="M660 0V320"/>
  <path d="M760 0V320"/>
  <path d="M860 0V320"/>
  <path d="M960 0V320"/>

  <path d="M0 60H1000"/>
  <path d="M0 120H1000"/>
  <path d="M0 180H1000"/>
  <path d="M0 240H1000"/>
  <path d="M0 300H1000"/>

</g>

<!-- ===================================================== -->

<!-- HEADER -->

<!-- ===================================================== -->

<text
x="45"
y="40"
fill="#94a3b8"
font-family="Arial, Helvetica, sans-serif"
font-size="12"
letter-spacing="3">

CAREER TRACK // IN PROGRESS

</text>

<circle
cx="938"
cy="35"
r="5"
fill="#22c55e"
filter="url(#glow)"
/>

<text
x="955"
y="40"
fill="#cbd5e1"
font-family="Arial, Helvetica, sans-serif"
font-size="11"
text-anchor="end">

SYSTEM ONLINE

</text>

<!-- ===================================================== -->

<!-- TRACK SHADOW -->

<!-- ===================================================== -->

<use
href="#raceLine"
fill="none"
stroke="#000000"
stroke-width="66"
opacity="0.65"
filter="url(#shadow)"
/>

<!-- ===================================================== -->

<!-- TRACK -->

<!-- ===================================================== -->

<use
href="#raceLine"
fill="none"
stroke="url(#road)"
stroke-width="52"
/>

<!-- track center -->

<use
href="#raceLine"
fill="none"
stroke="#111827"
stroke-width="43"
/>

<!-- moving road markings -->

<use
href="#raceLine"
fill="none"
stroke="#64748b"
stroke-width="2"
stroke-dasharray="14 18">

<animate
 attributeName="stroke-dashoffset"
 from="0"
 to="-64"
 dur="1.2s"
 repeatCount="indefinite"/>

</use>

