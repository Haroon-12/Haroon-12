<!-- ANIMATED CAR GLOW -->

<!-- ===================================================== -->

<circle
r="16"
fill="#ffffff"
opacity="0.18"
filter="url(#glow)">

<animateMotion
 dur="8s"
 repeatCount="indefinite"
 rotate="auto">

```
<mpath href="#raceLine"/>
